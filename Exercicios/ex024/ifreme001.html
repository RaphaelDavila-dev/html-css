<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conhecendo iframe</title>
    <style>
        p{
            font-size: 26px;
        }

        iframe{
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>testando o uso de iframe</h1>
    <p>Acessando o site do
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
         <a href="https://www.cursoemvideo.com" target="_blank">Cursoemvideo</a>
        </iframe>
        para aprender a programar
        
    <p>O repositorio do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io">no github</a>
        </iframe> 
        tambem é bem legal</p>
</body>
</html>
