<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesclando celulas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 300px;
            text-align: center;
        }

        td{
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>mesclando celulas</h1>
    <table>
        <tr>
            <td colspan="2">B</td>
            <td rowspan="4">C</td>
        </tr> 
        <tr>
            <td>D</td>
            <td>E</td>
        </tr>
        <tr>
            <td colspan="2">G</td>
        </tr>
        <tr>
            <td>J</td>
            <td rowspan="3">L</td>
        </tr>
        <tr>
            <td>M</td>
            <td>N</td>
        </tr>
        <tr>
            <td>O</td>
            <td>P</td>
        </tr>

    </table>
</body>
</html>
