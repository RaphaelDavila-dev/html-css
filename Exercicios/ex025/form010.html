<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.js" autocomplete="on" method="get">

    <p>
        <label for="iano">Digite seu ano de nascimento</label>
        <input type="number" name="ano" id="iano" min="1920" max="2026" oninput="calc()">
    </p>

    <p>
        <label for="iidade">Sua idade é:</label>
        <output id="iidade">0</output>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>

    <script>
        function calc(){
           let atual = new Date().getFullYear()
           iidade.innerHTML = Number(atual) - Number(iano.value)

        }
    </script>
</body>
</html>
