<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>teste de fomulario</h1>
    <form action="cadastro.js" autocomplete="on" method="get">
        <p>
            <label for="ifoto">Foto do perfil: <input type="file" name="foto" id="ifoto"></label>
        </p>
        <p>
            <label for="icor">Cor: <input type="color" name="cor" id="icor" value="#ffffff">
            </label>
        </p>

        <p>
            <label for="inivel">Nivel de satisfação: <input type="range" name="nivel" id="inivel" min="1" max="5">
            </label>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
