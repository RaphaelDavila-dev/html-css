<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>teste de formulario</h1>

    <p>
        <label for="in1">Numero 1: <input type="number" name="n1" id="in1" required min="0" max="10" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"></label>
    </p>

    <p>
        <label for="in2">Numero 2: <input type="number" name="n2" id="in2" required min="0" max="10" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"></label>
    </p>

    <p>
        <label for="isoma">Soma:</label>
        <output id="isoma">0</output>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
