<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste de formulario</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.js" method="get">
        <p>
            <label for="inome"> Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo">
        </p>
        <p>
            <label for="imes">Periodo letivo: <input type="month" name="mes" id="imes" required></label>
        </p>
        <p>
            <label for="idia">Dia da prova: <input type="date" name="dia" id="idia" required></label>
        </p>
        <p>
            <label for="ihora"> Horario da prova: <input type="time" name="hora" id="ihora" required></label>
        </p>
        <p>
            <label for="imedia">Nota:<input type="number" name="media" id="imedia" min="0" max="10" step="0.5" required></label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
