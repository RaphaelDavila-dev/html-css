<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>

    <form action="cadastro.js" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuario: <input type="text" name="usu" id="iusu" minlength="8" maxlength="16" placeholder="nome de usuario" size="10" autocomplete="username" required></label>
        </p>
        <p>
            <label for="isen">Senha: <input type="password" name="sen" id="isen" minlength="8" autocomplete="new-password" required></label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
