<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.js" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <label for="ismas"><input type="radio" name="sexo" id="ismas">Masculino</label>
            <label for="isfem"> <input type="radio" name="sexo" id="isfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="iesfut"><input type="checkbox" name="esfut" id="iesfut"> Futebol</label> <br>
            <label for="iesnat"><input type="checkbox" name="esnat" id="iesnat"> Natação</label> <br>
            <label for="iesbas"><input type="checkbox" name="esbas" id="iesbas"> Basquete</label> <br>
            <label for="iesvo"><input type="checkbox" name="esvo" id="iesvo"> Volei</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
